name: Bug report
description: Report a reproducible defect without sensitive data.
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not include credentials, private endpoints, keys, wallet material, or production data. Report security issues using SECURITY.md.
  - type: input
    id: version
    attributes:
      label: Commit or release
      placeholder: v0.1.0 or a full commit SHA
    validations:
      required: true
  - type: input
    id: component
    attributes:
      label: Component
      placeholder: bitcoin-core-connector, bitcoin-mempool, query-api
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
      description: Include exact safe error output where useful.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: List commands, fixtures, and configuration with all secrets removed.
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Verification already run
      placeholder: just check
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: This report contains no credentials, private keys, wallet material, private endpoints, or production data.
          required: true
