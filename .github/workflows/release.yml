name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-14
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup override set 1.97.1

      - name: Install Linux native build headers
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libcurl4-openssl-dev

      - name: Install pinned release tools
        run: cargo install --locked --version 0.9.1 --features cli cargo-about

      - name: Build release bundle
        run: ./scripts/release/build-release.sh "${GITHUB_REF_NAME}"

      - name: Smoke release bundle
        shell: bash
        run: |
          target="$(rustc -Vv | awk '/^host:/ {print $2}')"
          ./scripts/release/smoke-release.sh \
            "dist/multichain-rs-${GITHUB_REF_NAME}-${target}.tar.gz" \
            "dist/multichain-rs-${GITHUB_REF_NAME}-${target}.tar.gz.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ runner.os }}-${{ runner.arch }}
          path: dist/
          if-no-files-found: error

  publish:
    name: publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Create developer preview release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --verify-tag \
            --prerelease \
            --title "Multichain ${GITHUB_REF_NAME} developer preview" \
            --notes-file "docs/releases/${GITHUB_REF_NAME}.md" \
            dist/*
