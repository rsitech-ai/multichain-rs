name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component clippy,rustfmt
          rustup override set 1.97.1

      - name: Install Linux native build headers
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libcurl4-openssl-dev

      - name: Install pinned Rust verification tools
        run: |
          cargo install --locked --version 0.9.1 --features cli cargo-about
          cargo install --locked --version 0.20.2 cargo-deny

      - name: Install checksum-verified Buf
        run: |
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output /tmp/buf \
            https://github.com/bufbuild/buf/releases/download/v1.72.0/buf-Linux-x86_64
          echo "8720830e26a733da55bb89bcd3cb44849c0965fc0c44fb5d691cccdc64dca5af  /tmp/buf" \
            | sha256sum --check
          chmod +x /tmp/buf
          sudo mv /tmp/buf /usr/local/bin/buf

      - name: Install Gitleaks
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.1

      - name: Rust formatting
        run: cargo fmt --all -- --check

      - name: Rust lint
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Rust tests
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts
          cargo test --workspace --all-targets 2>&1 | tee artifacts/test-results.txt

      - name: Protobuf compatibility
        run: |
          buf lint
          buf build -o artifacts/platform.binpb
          buf breaking schemas/protobuf --against tests/contracts/platform-v1-baseline.binpb

      - name: Dependency policy
        run: |
          cargo deny check
          cargo deny list > artifacts/dependency-licenses.txt
          cargo about generate \
            --workspace \
            --locked \
            --fail \
            --output-file artifacts/third-party-licenses.html \
            scripts/release/third-party-licenses.hbs
          gitleaks detect --no-banner

      - name: Compose validation
        run: docker compose -f infra/compose.yaml config --quiet

      - name: Capture locked dependency inventory
        run: cargo tree --locked --workspace --all-features > artifacts/dependency-tree.txt

      - name: Build and smoke release bundle
        run: |
          ./scripts/release/build-release.sh v0.1.0
          ./scripts/release/smoke-release.sh \
            "dist/multichain-rs-v0.1.0-$(rustc -Vv | awk '/^host:/ {print $2}').tar.gz" \
            "dist/multichain-rs-v0.1.0-$(rustc -Vv | awk '/^host:/ {print $2}').tar.gz.sha256"
          mkdir -p artifacts/release
          cp dist/* artifacts/release/

      - uses: actions/upload-artifact@v4
        with:
          name: verification-artifacts
          path: artifacts/
          if-no-files-found: error
