<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">Multichain source-qualified blockchain infrastructure</title>
  <desc id="description">Bitcoin, Ethereum, Solana, and BNB Smart Chain observations flow through a durable write-ahead log into replayable facts.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08111f"/>
      <stop offset="1" stop-color="#102a43"/>
    </linearGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#50e3c2"/>
      <stop offset="1" stop-color="#5aa9ff"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" rx="36" fill="url(#background)"/>
  <g fill="none" stroke="#29445f" stroke-width="2">
    <path d="M160 190H430"/>
    <path d="M160 270H430"/>
    <path d="M160 350H430"/>
    <path d="M160 430H430"/>
    <path d="M610 310H910"/>
  </g>
  <g fill="#102a43" stroke="url(#signal)" stroke-width="3">
    <rect x="80" y="158" width="200" height="64" rx="14"/>
    <rect x="80" y="238" width="200" height="64" rx="14"/>
    <rect x="80" y="318" width="200" height="64" rx="14"/>
    <rect x="80" y="398" width="200" height="64" rx="14"/>
    <rect x="430" y="246" width="180" height="128" rx="18"/>
    <rect x="910" y="246" width="210" height="128" rx="18"/>
  </g>
  <g fill="#d9e8f5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22">
    <text x="112" y="198">Bitcoin</text>
    <text x="112" y="278">Ethereum</text>
    <text x="112" y="358">Solana</text>
    <text x="112" y="438">BNB Chain</text>
    <text x="476" y="303">durable</text>
    <text x="486" y="334">WAL</text>
    <text x="947" y="303">replayable</text>
    <text x="979" y="334">facts</text>
  </g>
  <circle cx="760" cy="310" r="18" fill="#50e3c2"/>
  <circle cx="820" cy="310" r="10" fill="#5aa9ff"/>
  <text x="80" y="92" fill="#f4f8fb" font-family="ui-sans-serif, system-ui, sans-serif" font-size="54" font-weight="700">Multichain</text>
  <text x="80" y="130" fill="#9fb8cc" font-family="ui-sans-serif, system-ui, sans-serif" font-size="24">Persist the exact source observation before interpreting it.</text>
  <text x="80" y="548" fill="#9fb8cc" font-family="ui-sans-serif, system-ui, sans-serif" font-size="22">Rust · source-qualified · revision-aware</text>
  <text x="1010" y="548" fill="#f4f8fb" font-family="ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="600">RSI Tech</text>
</svg>
