# Bitcoin mainnet observer. Bind every control and notification surface locally;
# expose them to the connector only through a private host/network boundary.
server=1
listen=1
disablewallet=1
txindex=1
rpcbind=127.0.0.1
rpcallowip=127.0.0.1
rpcauth=REPLACE_WITH_GENERATED_RPCAUTH
zmqpubrawtx=tcp://127.0.0.1:28332
zmqpubrawblock=tcp://127.0.0.1:28332
zmqpubsequence=tcp://127.0.0.1:28332
