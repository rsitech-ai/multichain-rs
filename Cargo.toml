[workspace]
resolver = "3"
members = [
  "crates/*",
  "connectors/*",
  "processors/*",
  "services/*",
  "tests/e2e",
  "tests/fault",
  "tests/integration",
]

[workspace.package]
authors = ["RSI Tech <info@rsitech.ai>"]
edition = "2024"
homepage = "https://rsitech.ai"
rust-version = "1.94"
license = "Apache-2.0"
publish = false
readme = "README.md"
repository = "https://github.com/rsitech-ai/multichain-rs"
version = "0.1.0"

[workspace.metadata.multichain]
copyright-owner = "Rafal Sikora"
maintainer = "RSI Tech"
contact = "info@rsitech.ai"
website = "https://rsitech.ai"

[workspace.dependencies]
alloy = { version = "=2.2.0", default-features = false }
async-trait = { version = "=0.1.91", default-features = false }
axum = { version = "=0.8.9", default-features = false }
bitcoin = { version = "=0.32.101", default-features = false }
blake3 = { version = "=1.8.5", default-features = false, features = ["std"] }
bs58 = { version = "=0.5.1", default-features = false, features = ["std"] }
crc32c = { version = "=0.6.8", default-features = false }
futures-util = { version = "=0.3.33", default-features = false, features = ["sink", "std"] }
getrandom = { version = "=0.4.3", default-features = false }
object_store = { version = "=0.14.1", default-features = false, features = ["aws"] }
prost = { version = "=0.14.4", default-features = false, features = ["derive", "std"] }
rdkafka = { version = "=0.39.0", default-features = false, features = ["cmake-build", "tokio"] }
reqwest = { version = "=0.13.4", default-features = false, features = ["json", "query"] }
serde = { version = "=1.0.229", default-features = false, features = ["derive", "std"] }
serde_json = { version = "=1.0.149", default-features = false, features = ["std"] }
sha2 = { version = "=0.11.0", default-features = false }
solana-hash = { version = "=4.5.0", default-features = false, features = ["decode", "serde", "std"] }
solana-pubkey = { version = "=4.2.0", default-features = false, features = ["serde", "std"] }
solana-signature = { version = "=3.4.1", default-features = false, features = ["serde", "std"] }
sqlx = { version = "=0.9.0", default-features = false, features = ["postgres", "runtime-tokio", "tls-none"] }
time = { version = "=0.3.54", default-features = false }
thiserror = { version = "=2.0.19", default-features = false }
tokio = { version = "=1.51.0", default-features = false }
tokio-tungstenite = { version = "=0.29.0", default-features = false, features = ["connect", "handshake"] }
tokio-util = { version = "=0.7.19", default-features = false, features = ["rt"] }
tonic = { version = "=0.14.6", default-features = false }
tempfile = { version = "=3.23.0", default-features = false }
zstd = { version = "=0.13.3", default-features = false }
zeromq = { version = "=0.6.0", default-features = false, features = ["tcp-transport", "tokio-runtime"] }
yellowstone-grpc-client = { version = "=13.2.1", default-features = false }
yellowstone-grpc-proto = { version = "=12.5.0", default-features = false }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
