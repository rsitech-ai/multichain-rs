[workspace]
resolver = "3"
members = [
  "crates/*",
  "connectors/*",
  "processors/*",
  "services/*",
]

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0 OR MIT"
version = "0.1.0"

[workspace.dependencies]
alloy = { version = "=2.2.0", default-features = false }
axum = { version = "=0.8.9", default-features = false }
bitcoin = { version = "=0.32.101", default-features = false }
prost = { version = "=0.14.4", default-features = false, features = ["derive", "std"] }
rdkafka = { version = "=0.39.0", default-features = false }
sqlx = { version = "=0.9.0", default-features = false }
tokio = { version = "=1.51.0", default-features = false }
tonic = { version = "=0.14.6", default-features = false }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
