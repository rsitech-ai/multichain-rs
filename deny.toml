[advisories]
yanked = "deny"
ignore = [
  { id = "RUSTSEC-2024-0436", reason = "Alloy 2.2.0 requires alloy-primitives 1.6.1, which uses paste only at compile time; no maintained compatible upstream release removes it. Re-evaluate on every Alloy upgrade." },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[licenses]
confidence-threshold = 0.8
unused-allowed-license = "allow"
allow = [
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MITNFA",
  "OpenSSL",
  "Unicode-3.0",
  "Zlib",
]

[sources]
unknown-git = "deny"
unknown-registry = "deny"
